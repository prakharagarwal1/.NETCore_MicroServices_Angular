version: "3.9"

name: learningshop

services:
  products:
    build:
      context: .
      dockerfile: backend/services/LearningShop.ProductService/Dockerfile
    container_name: learning-shop-products
    env_file:
      - backend/services/LearningShop.ProductService/.env
    ports:
      - "5001:5001"
    networks:
      - shop

  orders:
    build:
      context: .
      dockerfile: backend/services/LearningShop.OrderService/Dockerfile
    container_name: learning-shop-orders
    env_file:
      - backend/services/LearningShop.OrderService/.env
    ports:
      - "5002:5002"
    networks:
      - shop

  cart:
    build:
      context: .
      dockerfile: backend/services/LearningShop.CartService/Dockerfile
    container_name: learning-shop-cart
    env_file:
      - backend/services/LearningShop.CartService/.env
    ports:
      - "5003:5003"
    networks:
      - shop

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/LearningShop.Gateway/Dockerfile
    container_name: learning-shop-gateway
    env_file:
      - backend/gateway/LearningShop.Gateway/.env
    ports:
      - "5000:5000"
    depends_on:
      - products
      - orders
      - cart
    networks:
      - shop

  ui:
    build:
      context: ./frontend/learning-shop-ui
      dockerfile: Dockerfile
    container_name: learning-shop-ui
    env_file:
      - ./frontend/learning-shop-ui/.env
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - shop

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: learning-shop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - shop

networks:
  shop:
    driver: bridge

volumes:
  rabbitmq-data: