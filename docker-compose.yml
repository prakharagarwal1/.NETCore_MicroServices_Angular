version: "3.9"

name: learningshop

services:
  products:
    build:
      context: .
      dockerfile: backend/services/LearningShop.ProductService/Dockerfile
    container_name: learning-shop-products
    env_file:
      - backend/services/LearningShop.ProductService/.env
    ports:
      - "5101:5101"
    networks:
      - shop

  orders:
    build:
      context: .
      dockerfile: backend/services/LearningShop.OrderService/Dockerfile
    container_name: learning-shop-orders
    env_file:
      - backend/services/LearningShop.OrderService/.env
    ports:
      - "5102:5102"
    networks:
      - shop

  gateway:
    build:
      context: .
      dockerfile: backend/gateway/LearningShop.Gateway/Dockerfile
    container_name: learning-shop-gateway
    env_file:
      - backend/gateway/LearningShop.Gateway/.env
    ports:
      - "5100:5100"
    depends_on:
      - products
      - orders
    networks:
      - shop

  ui:
    build:
      context: ./frontend/learning-shop-ui
      dockerfile: Dockerfile
    container_name: learning-shop-ui
    env_file:
      - ./frontend/learning-shop-ui/.env
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - shop

networks:
  shop:
    driver: bridge