version: "3.9"

services:
  products:
    volumes:
      - ./backend/services/LearningShop.ProductService:/app/backend/services/LearningShop.ProductService:consistent
    build:
      context: .
      dockerfile: backend/services/LearningShop.ProductService/Dockerfile.dev
    entrypoint:
      - dotnet
      - watch
      - run
      - --no-launch-profile
      - --project
      - /app/backend/services/LearningShop.ProductService/LearningShop.ProductService.csproj
    develop:
      watch:
        - action: rebuild
          path: ./backend/services/LearningShop.ProductService/LearningShop.ProductService.csproj
        - action: rebuild
          path: ./backend/services/LearningShop.ProductService/Dockerfile.dev

  orders:
    volumes:
      - ./backend/services/LearningShop.OrderService:/app/backend/services/LearningShop.OrderService:consistent
    build:
      context: .
      dockerfile: backend/services/LearningShop.OrderService/Dockerfile.dev
    entrypoint:
      - dotnet
      - watch
      - run
      - --no-launch-profile
      - --project
      - /app/backend/services/LearningShop.OrderService/LearningShop.OrderService.csproj
    develop:
      watch:
        - action: rebuild
          path: ./backend/services/LearningShop.OrderService/LearningShop.OrderService.csproj
        - action: rebuild
          path: ./backend/services/LearningShop.OrderService/Dockerfile.dev

  gateway:
    volumes:
      - ./backend/gateway/LearningShop.Gateway:/app/backend/gateway/LearningShop.Gateway:consistent
    build:
      context: .
      dockerfile: backend/gateway/LearningShop.Gateway/Dockerfile.dev
    entrypoint:
      - dotnet
      - watch
      - run
      - --no-launch-profile
      - --project
      - /app/backend/gateway/LearningShop.Gateway/LearningShop.Gateway.csproj
    develop:
      watch:
        - action: rebuild
          path: ./backend/gateway/LearningShop.Gateway/LearningShop.Gateway.csproj
        - action: rebuild
          path: ./backend/gateway/LearningShop.Gateway/Dockerfile.dev

  ui:
    volumes:
      - ./frontend/learning-shop-ui:/app:consistent
      - ui-node-modules:/app/node_modules
    build:
      context: ./frontend/learning-shop-ui
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    entrypoint:
      - node
      - node_modules/@angular/cli/bin/ng.js
      - serve
      - --host
      - 0.0.0.0
      - --watch
      - --proxy-config
      - proxy.docker.conf.json
    develop:
      watch:
        - action: rebuild
          path: ./frontend/learning-shop-ui/package.json
        - action: rebuild
          path: ./frontend/learning-shop-ui/package-lock.json
        - action: rebuild
          path: ./frontend/learning-shop-ui/Dockerfile.dev
        - action: sync
          path: ./frontend/learning-shop-ui
          target: /app
          ignore:
            - .env
            - .env-sample
            - .dockerignore
            - Dockerfile
            - Dockerfile.dev
            - node_modules/
            - package.json
            - package-lock.json

volumes:
  ui-node-modules: