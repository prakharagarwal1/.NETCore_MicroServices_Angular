<article class="product-card">

    <span class="badge">
        Product #{{ product().id }}
    </span>

    <h3>{{ product().name }}</h3>

    <p class="price">
        {{ product().price | currency:'INR':'symbol':'1.0-2' }}
    </p>

    <button type="button" (click)="addToCart()">
        Add to Cart
    </button>

</article>
