<div class="products-page">
  <header class="page-header">
    <h1>Products</h1>
    <div class="search-bar">
      <input
        type="text"
        placeholder="Search products..."
        [formControl]="searchForm.controls.query"
        (keyup.enter)="onSearch()"
      />
      <button type="button" (click)="clearSearch()" *ngIf="searchQuery()">
        ✕
      </button>
    </div>
  </header>

  <nav class="category-filter" *ngIf="categories().length > 0">
    <button
      *ngFor="let cat of categories()"
      class="cat-chip"
      [class.active]="selectedCategory() === cat"
      (click)="selectCategory(cat)"
    >
      {{ cat }}
    </button>
  </nav>

  <div *ngIf="loading()" class="loading">Loading products…</div>

  <div *ngIf="error()" class="error">{{ error() }}</div>

  <div *ngIf="!loading() && filteredProducts.length === 0" class="empty">
    No products match your search.
  </div>

  <div class="product-grid" *ngIf="!loading() && filteredProducts.length > 0">
    <app-product-card
      *ngFor="let product of filteredProducts"
      [product]="product"
      (productAdded)="addToCart($event)"
    ></app-product-card>
  </div>

  <footer class="cart-fab">
    <button class="fab" routerLink="/cart">
      🛒 <span *ngIf="cartCount() > 0">{{ cartCount() }}</span>
    </button>
  </footer>
</div>
